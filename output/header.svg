
    <svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        
    <style>
        .bg { fill: #0d1117; }
        .panel { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 8px; }
        .glow-border { 
            fill: none; 
            stroke: url(#cyan-glow); 
            stroke-width: 1.5px; 
            rx: 8px; 
        }
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
        .text-title { fill: #ffffff; font-weight: 600; }
        .text-subtitle { fill: #8b949e; }
        .text-accent { fill: #58a6ff; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
        .text-mono { fill: #3fb950; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
        .text-glow { fill: #00ffcc; font-weight: 600; }
        
        .tag-pill { fill: transparent; stroke: #30363d; stroke-width: 1px; rx: 12px; }
        .tag-text { fill: #c9d1d9; font-weight: 600; }
        
        .progress-bg { fill: #21262d; rx: 4px; }
        .progress-fill { rx: 4px; }
        
        .dot { fill: #30363d; }
        .dot-glow { fill: #00ffcc; filter: drop-shadow(0 0 5px #00ffcc); }
    </style>
    <defs>
        <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#00ffcc" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.8"/>
        </linearGradient>
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
        <rect width="800" height="200" class="bg"/>
        
        <!-- Outer Glowing Box -->
        <rect x="20" y="20" width="760" height="160" class="glow-border"/>
        
        <!-- Inner Box -->
        <rect x="21" y="21" width="758" height="158" class="panel"/>
        
        <!-- Avatar Placeholder -->
        <circle cx="100" cy="100" r="45" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
        <text x="100" y="105" text-anchor="middle" class="text-accent" font-size="24">@O</text>
        
        <!-- Handle & Name -->
        <text x="170" y="65" class="text-accent" font-size="13">@octocat</text>
        <text x="170" y="100" class="text-title" font-size="28">The Octocat</text>
        <text x="170" y="125" class="text-subtitle" font-size="12">Building cool things on GitHub.</text>
        
        <!-- Tags -->
        <g transform="translate(170, 145)">
            <rect x="0" y="0" width="80" height="24" class="tag-pill"/>
            <text x="40" y="16" text-anchor="middle" class="tag-text" font-size="12">Developer</text>
            
            <rect x="90" y="0" width="80" height="24" class="tag-pill"/>
            <text x="130" y="16" text-anchor="middle" class="tag-text" font-size="12">Open Source</text>
        </g>
        
        <!-- Total Stars -->
        <g transform="translate(650, 100)">
            <text x="50" y="-10" text-anchor="middle" class="text-title" fill="#58a6ff" font-size="32">22192</text>
            <text x="50" y="15" text-anchor="middle" class="text-subtitle" font-size="10" font-weight="600" letter-spacing="2">TOTAL STARS</text>
        </g>
    </svg>
    