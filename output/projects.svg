
    <svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;family=Inter:wght@400;600;800&amp;display=swap');
        
        .bg { fill: #0d1117; }
        .panel { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 8px; }
        .glow-border { 
            fill: none; 
            stroke: url(#cyan-glow); 
            stroke-width: 1.5px; 
            rx: 8px; 
        }
        .text-main { fill: #c9d1d9; font-family: 'Inter', sans-serif; font-size: 14px; }
        .text-title { fill: #ffffff; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 28px; }
        .text-subtitle { fill: #8b949e; font-family: 'Inter', sans-serif; font-size: 12px; }
        .text-accent { fill: #58a6ff; font-family: 'Fira Code', monospace; font-size: 13px; }
        .text-mono { fill: #3fb950; font-family: 'Fira Code', monospace; font-size: 12px; }
        .text-glow { fill: #00ffcc; font-family: 'Inter', sans-serif; font-weight: 800; }
        
        .tag-pill { fill: transparent; stroke: #30363d; stroke-width: 1px; rx: 12px; }
        .tag-text { fill: #c9d1d9; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; }
        
        .progress-bg { fill: #21262d; rx: 4px; }
        .progress-fill { rx: 4px; }
        
        .dot { fill: #30363d; }
        .dot-glow { fill: #00ffcc; filter: drop-shadow(0 0 5px #00ffcc); }
    </style>
    <defs>
        <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#00ffcc" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.8"/>
        </linearGradient>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0d1117" />
            <stop offset="100%" stop-color="#000000" />
        </linearGradient>
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
        <rect width="800" height="240" fill="url(#bg-gradient)"/>
        
        <!-- Outer Glowing Box -->
        <rect x="20" y="20" width="760" height="200" class="glow-border"/>
        <rect x="21" y="21" width="758" height="198" class="panel"/>
        
        <!-- Header -->
        <text x="40" y="50" class="text-title" font-size="14" fill="#58a6ff" letter-spacing="2">PROJECTS.LIST</text>
        <text x="180" y="50" class="text-subtitle">./projects.sh --all</text>
        
        <text x="750" y="50" text-anchor="end" class="text-subtitle">2 pinned</text>
        
        <line x1="21" y1="60" x2="779" y2="60" stroke="#30363d" stroke-width="1"/>
        
        
        <g transform="translate(35, 70)">
            <rect x="0" y="0" width="350" height="130" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
            <rect x="0" y="0" width="350" height="30" fill="#21262d" rx="4"/>
            
            <circle cx="15" cy="15" r="4" fill="#58a6ff"/>
            <text x="30" y="19" class="text-accent" font-size="12">Hello-World</text>
            
            <text x="15" y="55" class="text-title" font-size="18">Hello-World</text>
            <text x="15" y="75" class="text-subtitle">My first repository on GitHub!</text>
            
            <!-- Language Pill -->
            <rect x="15" y="95" width="80" height="20" class="tag-pill" rx="10"/>
            <text x="55" y="109" text-anchor="middle" class="tag-text" font-size="10">None</text>
            
            <text x="110" y="109" class="text-subtitle" font-size="10">★ 3823  updated just now</text>
            
            <!-- A decorative circular progress or icon on the right -->
            <circle cx="300" cy="80" r="20" fill="transparent" stroke="#30363d" stroke-width="4"/>
            <circle cx="300" cy="80" r="20" fill="transparent" stroke="#58a6ff" stroke-width="4" stroke-dasharray="80" stroke-dashoffset="20"/>
            <text x="300" y="84" text-anchor="middle" class="text-main" font-size="10" font-weight="bold">88%</text>
        </g>
        
        <g transform="translate(400, 70)">
            <rect x="0" y="0" width="350" height="130" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
            <rect x="0" y="0" width="350" height="30" fill="#21262d" rx="4"/>
            
            <circle cx="15" cy="15" r="4" fill="#58a6ff"/>
            <text x="30" y="19" class="text-accent" font-size="12">octocat.github.io</text>
            
            <text x="15" y="55" class="text-title" font-size="18">octocat.github.io</text>
            <text x="15" y="75" class="text-subtitle">A cool project.</text>
            
            <!-- Language Pill -->
            <rect x="15" y="95" width="80" height="20" class="tag-pill" rx="10"/>
            <text x="55" y="109" text-anchor="middle" class="tag-text" font-size="10">CSS</text>
            
            <text x="110" y="109" class="text-subtitle" font-size="10">★ 1170  updated just now</text>
            
            <!-- A decorative circular progress or icon on the right -->
            <circle cx="300" cy="80" r="20" fill="transparent" stroke="#30363d" stroke-width="4"/>
            <circle cx="300" cy="80" r="20" fill="transparent" stroke="#58a6ff" stroke-width="4" stroke-dasharray="80" stroke-dashoffset="20"/>
            <text x="300" y="84" text-anchor="middle" class="text-main" font-size="10" font-weight="bold">88%</text>
        </g>
        
    </svg>
    