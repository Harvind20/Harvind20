
    <svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;family=Inter:wght@400;600;800&amp;display=swap');
        
        .bg { fill: #0d1117; }
        .panel { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 8px; }
        .glow-border { 
            fill: none; 
            stroke: url(#cyan-glow); 
            stroke-width: 1.5px; 
            rx: 8px; 
        }
        .text-main { fill: #c9d1d9; font-family: 'Inter', sans-serif; font-size: 14px; }
        .text-title { fill: #ffffff; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 28px; }
        .text-subtitle { fill: #8b949e; font-family: 'Inter', sans-serif; font-size: 12px; }
        .text-accent { fill: #58a6ff; font-family: 'Fira Code', monospace; font-size: 13px; }
        .text-mono { fill: #3fb950; font-family: 'Fira Code', monospace; font-size: 12px; }
        .text-glow { fill: #00ffcc; font-family: 'Inter', sans-serif; font-weight: 800; }
        
        .tag-pill { fill: transparent; stroke: #30363d; stroke-width: 1px; rx: 12px; }
        .tag-text { fill: #c9d1d9; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; }
        
        .progress-bg { fill: #21262d; rx: 4px; }
        .progress-fill { rx: 4px; }
        
        .dot { fill: #30363d; }
        .dot-glow { fill: #00ffcc; filter: drop-shadow(0 0 5px #00ffcc); }
    </style>
    <defs>
        <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#00ffcc" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.8"/>
        </linearGradient>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0d1117" />
            <stop offset="100%" stop-color="#000000" />
        </linearGradient>
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
        <rect width="800" height="240" fill="url(#bg-gradient)"/>
        
        <!-- Outer Glowing Box -->
        <rect x="20" y="20" width="760" height="200" class="glow-border"/>
        <rect x="21" y="21" width="758" height="198" class="panel"/>
        
        <!-- Header -->
        <text x="40" y="60" class="text-title" font-size="24">Language Stack</text>
        <text x="40" y="80" class="text-subtitle">Repository-weighted technologies</text>
        
        <text x="750" y="60" text-anchor="end" class="text-accent" fill="#58a6ff">&gt; stack.scan</text>
        
        
        <circle cx="45" cy="106" r="4" fill="#9e60ff"/>
        <text x="65" y="110" class="text-main" font-weight="bold">CSS</text>
        <text x="240" y="110" class="text-accent" fill="#9e60ff">33%</text>
        
        <rect x="280" y="102" width="450" height="8" class="progress-bg"/>
        <rect x="280" y="102" width="148.5" height="8" class="progress-fill" fill="#9e60ff"/>
        
        <circle cx="45" cy="141" r="4" fill="#ff5a36"/>
        <text x="65" y="145" class="text-main" font-weight="bold">Ruby</text>
        <text x="240" y="145" class="text-accent" fill="#ff5a36">33%</text>
        
        <rect x="280" y="137" width="450" height="8" class="progress-bg"/>
        <rect x="280" y="137" width="148.5" height="8" class="progress-fill" fill="#ff5a36"/>
        
        <circle cx="45" cy="176" r="4" fill="#e3b341"/>
        <text x="65" y="180" class="text-main" font-weight="bold">HTML</text>
        <text x="240" y="180" class="text-accent" fill="#e3b341">33%</text>
        
        <rect x="280" y="172" width="450" height="8" class="progress-bg"/>
        <rect x="280" y="172" width="148.5" height="8" class="progress-fill" fill="#e3b341"/>
        
    </svg>
    