
    <svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
        
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;family=Inter:wght@400;600;800&amp;display=swap');
        
        .bg { fill: #0d1117; }
        .panel { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 8px; }
        .glow-border { 
            fill: none; 
            stroke: url(#cyan-glow); 
            stroke-width: 1.5px; 
            rx: 8px; 
        }
        .text-main { fill: #c9d1d9; font-family: 'Inter', sans-serif; font-size: 14px; }
        .text-title { fill: #ffffff; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 28px; }
        .text-subtitle { fill: #8b949e; font-family: 'Inter', sans-serif; font-size: 12px; }
        .text-accent { fill: #58a6ff; font-family: 'Fira Code', monospace; font-size: 13px; }
        .text-mono { fill: #3fb950; font-family: 'Fira Code', monospace; font-size: 12px; }
        .text-glow { fill: #00ffcc; font-family: 'Inter', sans-serif; font-weight: 800; }
        
        .tag-pill { fill: transparent; stroke: #30363d; stroke-width: 1px; rx: 12px; }
        .tag-text { fill: #c9d1d9; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; }
        
        .progress-bg { fill: #21262d; rx: 4px; }
        .progress-fill { rx: 4px; }
        
        .dot { fill: #30363d; }
        .dot-glow { fill: #00ffcc; filter: drop-shadow(0 0 5px #00ffcc); }
    </style>
    <defs>
        <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#00ffcc" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.8"/>
        </linearGradient>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0d1117" />
            <stop offset="100%" stop-color="#000000" />
        </linearGradient>
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
        <rect width="800" height="400" fill="url(#bg-gradient)"/>
        
        <!-- Outer Glowing Box -->
        <rect x="20" y="20" width="760" height="360" class="glow-border"/>
        <rect x="21" y="21" width="758" height="358" class="panel"/>
        
        <!-- Terminal Header -->
        <circle cx="40" cy="40" r="4" fill="#ff5f56"/>
        <circle cx="55" cy="40" r="4" fill="#ffbd2e"/>
        <circle cx="70" cy="40" r="4" fill="#27c93f"/>
        
        <text x="400" y="44" text-anchor="middle" class="text-accent" font-size="12">octocat@github ~ $ ./profile-scan --live</text>
        
        <text x="750" y="44" text-anchor="end" class="text-glow" fill="#00ffcc" font-size="12">● LIVE</text>
        
        <line x1="21" y1="55" x2="779" y2="55" stroke="#30363d" stroke-width="1"/>
        
        <!-- Left Panel: Visual Map -->
        <rect x="35" y="70" width="350" height="295" fill="transparent" stroke="#30363d" stroke-width="1" rx="4"/>
        <text x="45" y="85" class="text-accent" font-size="10">VISUAL.MAP</text>
        <text x="40" y="80" class="text-mono" fill="#00ff00" opacity="0.6" font-size="10">  . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . </text>
<text x="40" y="96" class="text-mono" fill="#00ff00" opacity="0.6" font-size="10">  . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . </text>
<text x="40" y="112" class="text-mono" fill="#00ff00" opacity="0.6" font-size="10">  . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . </text>
<text x="40" y="128" class="text-mono" fill="#00ff00" opacity="0.6" font-size="10">  . . . . . . . . . . . . . /\\ . . . . . . . . . . . . . . . . . . . . . </text>
<text x="40" y="144" class="text-mono" fill="#00ff00" opacity="0.6" font-size="10">  . . . . . . . . . . . . /  \\ . . . . . . . . . . . . . . . . . . . . . </text>
<text x="40" y="160" class="text-mono" fill="#00ff00" opacity="0.6" font-size="10">  . . . . . . . . . . . /____\\ . . . . . . . . . . . . . . . . . . . . . </text>
<text x="40" y="176" class="text-mono" fill="#00ff00" opacity="0.6" font-size="10">  . . . . . . . . . . . |    | . . . . . . . . . . . . . . . . . . . . . </text>
<text x="40" y="192" class="text-mono" fill="#00ff00" opacity="0.6" font-size="10">  . . . . . . . . . . . |____| . . . . . . . . . . . . . . . . . . . . . </text>
<text x="40" y="208" class="text-mono" fill="#00ff00" opacity="0.6" font-size="10">  . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . </text>
<text x="40" y="224" class="text-mono" fill="#00ff00" opacity="0.6" font-size="10">  . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . </text>

        
        <!-- A glowing horizontal line simulating a scanner -->
        <rect x="35" y="150" width="350" height="2" fill="#00ffcc" filter="url(#neon-glow)"/>
        <rect x="35" y="140" width="350" height="20" fill="#00ffcc" opacity="0.1"/>
        
        <!-- Right Panel: System Info -->
        <rect x="400" y="70" width="365" height="295" fill="transparent" stroke="#30363d" stroke-width="1" rx="4"/>
        <text x="410" y="85" class="text-accent" font-size="10">SYSTEM.INFO</text>
        
        <g transform="translate(410, 110)">
            <text x="0" y="0" class="text-accent">Subject</text>
            <text x="120" y="0" class="text-main">The Octocat</text>
            <line x1="0" y1="5" x2="340" y2="5" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2"/>
            
            <text x="0" y="25" class="text-accent">Handle</text>
            <text x="120" y="25" class="text-main">@octocat</text>
            <line x1="0" y1="30" x2="340" y2="30" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2"/>
            
            <text x="0" y="50" class="text-accent">Role</text>
            <text x="120" y="50" class="text-main">Developer</text>
            <line x1="0" y1="55" x2="340" y2="55" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2"/>
            
            <!-- Highlighted Status Row -->
            <rect x="-5" y="62" width="350" height="24" fill="#00ffcc" opacity="0.1" rx="4"/>
            <text x="0" y="78" class="text-glow">Status</text>
            <text x="120" y="78" class="text-glow">Building | Learning | Shipping</text>
            <line x1="0" y1="88" x2="340" y2="88" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2"/>
            
            <text x="0" y="110" class="text-accent">Languages</text>
            <text x="120" y="110" class="text-main">CSS, Ruby, HTML</text>
            <line x1="0" y1="115" x2="340" y2="115" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2"/>
            
            <text x="0" y="135" class="text-accent">Repositories</text>
            <text x="120" y="135" class="text-main">8</text>
            <line x1="0" y1="140" x2="340" y2="140" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2"/>
            
            <text x="0" y="160" class="text-accent">Stars</text>
            <text x="120" y="160" class="text-main">22192</text>
            <line x1="0" y1="165" x2="340" y2="165" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2"/>
            
            <text x="0" y="185" class="text-accent">Followers</text>
            <text x="120" y="185" class="text-main">24150</text>
            <line x1="0" y1="190" x2="340" y2="190" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2"/>
            
            <text x="0" y="210" class="text-accent">Contact</text>
            <text x="120" y="210" class="text-main">github.com/octocat</text>
        </g>
    </svg>
    